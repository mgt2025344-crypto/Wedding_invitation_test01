  <rect x="102" y="262" width="21" height="138" rx="3" fill="#3b3433"/>
  <ellipse cx="86" cy="402" rx="17" ry="6" fill="#241f1e"/>
  <ellipse cx="114" cy="402" rx="17" ry="6" fill="#241f1e"/>
