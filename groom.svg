  <path d="M68 120 C54 160 52 220 56 266 L72 266 C72 222 76 172 84 132Z" fill="#4a4140"/>
  <path d="M132 120 C146 160 148 220 144 266 L128 266 C128 222 124 172 116 132Z" fill="#4a4140"/>
  <circle cx="64" cy="272" r="8" fill="#f3d2b8"/>
  <circle cx="136" cy="272" r="8" fill="#f3d2b8"/>
