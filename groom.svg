  <path d="M86 63 l9 -2 M105 61 l9 2" stroke="#3a2a22" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M93 82 q7 6 14 0" stroke="#b86b5e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="86" cy="78" r="4" fill="#f1a9a0" opacity=".45"/>
  <circle cx="114" cy="78" r="4" fill="#f1a9a0" opacity=".45"/>
