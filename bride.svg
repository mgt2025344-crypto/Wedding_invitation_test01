<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 420" role="img" aria-label="Illustrated bride">
  <!-- ground shadow -->
  <ellipse cx="100" cy="408" rx="74" ry="8" fill="#b8935a" opacity=".18"/>
  <!-- veil (behind) -->
  <path d="M100 38 C55 46 48 170 34 372 C70 394 130 394 166 372 C152 170 145 46 100 38Z" fill="#ffffff" opacity=".62" stroke="#e8d9b8" stroke-width="1.5"/>
  <!-- skirt -->
  <path d="M84 168 L116 168 C122 220 150 300 186 392 C140 412 60 412 14 392 C50 300 78 220 84 168Z" fill="#fffaf1" stroke="#d9bf8c" stroke-width="2"/>
  <path d="M100 200 C100 280 96 340 80 402 M100 200 C104 280 118 340 140 404 M92 230 C70 300 52 350 38 398 M108 230 C130 300 150 350 164 398" stroke="#eadcc0" fill="none" stroke-width="1.5" stroke-linecap="round"/>
  <!-- bodice -->
  <path d="M82 112 L118 112 L121 168 L79 168Z" fill="#fffaf1" stroke="#d9bf8c" stroke-width="2"/>
  <rect x="79" y="160" width="42" height="9" rx="2" fill="#d9bf8c"/>
  <!-- neck + shoulders -->
  <rect x="94" y="92" width="12" height="24" fill="#f3d2b8"/>
  <path d="M80 120 C88 104 112 104 120 120 L116 130 C108 122 92 122 84 130Z" fill="#f3d2b8"/>
  <!-- arms -->
  <path d="M80 122 C64 146 62 176 82 204" stroke="#f3d2b8" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M120 122 C136 146 138 176 118 204" stroke="#f3d2b8" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- bouquet -->
  <path d="M100 232 L92 206 M100 232 L108 206" stroke="#7d9a6a" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="86" cy="204" rx="8" ry="14" fill="#7d9a6a" transform="rotate(-50 86 204)"/>
  <ellipse cx="114" cy="204" rx="8" ry="14" fill="#7d9a6a" transform="rotate(50 114 204)"/>
  <circle cx="100" cy="196" r="12" fill="#ecc9c0"/>
  <circle cx="88" cy="206" r="9" fill="#ffffff" stroke="#e8d9b8"/>
  <circle cx="112" cy="206" r="9" fill="#f6dcd4"/>
  <circle cx="100" cy="210" r="8" fill="#e9c98f"/>
  <circle cx="100" cy="196" r="3.5" fill="#d9a89b"/>
  <!-- head -->
  <ellipse cx="100" cy="76" rx="22" ry="26" fill="#f3d2b8"/>
  <!-- hair + bun -->
  <path d="M77 76 C72 44 96 34 112 40 C128 46 130 62 123 78 C118 60 104 52 90 56 C84 60 80 68 77 76Z" fill="#6b4a35"/>
  <circle cx="100" cy="34" r="10" fill="#6b4a35"/>
  <!-- hair flowers -->
  <circle cx="84" cy="48" r="5" fill="#ecc9c0"/>
  <circle cx="94" cy="42" r="4" fill="#ffffff" stroke="#e8d9b8"/>
  <circle cx="108" cy="42" r="4" fill="#e9c98f"/>
  <!-- face -->
  <path d="M89 78 q4 3 8 0 M103 78 q4 3 8 0" stroke="#5a3e2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M94 90 q6 5 12 0" stroke="#c4776a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="86" cy="86" r="4" fill="#f1a9a0" opacity=".5"/>
  <circle cx="114" cy="86" r="4" fill="#f1a9a0" opacity=".5"/>
</svg>
